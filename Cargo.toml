[workspace]
members = [
    "crates/core",
    "crates/python",
    "crates/wasm",
]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/JaimeCuartas/hitman-sat"
version = "0.1.2"
edition = "2024"
readme = "README.md"

[workspace.dependencies]
hitman = { package = "hitman-sat", path = "crates/core" }

[workspace.lints.clippy]
#Report everything that can be concerning as warning
pedantic = { level = "warn", priority = -1 }

[profile.release]
#speed over size
opt-level = 3
#No compilation of unused code but slower to compile
lto = true
# Optimization over speed of compilation
codegen-units = 1
#Size of compilation over readability on errors
strip = true
